name: main_analysis
version: "1.1"
description: "Generate a concise natural-language summary for final betting event analysis."

system_prompt: |
  You are a summarization assistant specializing in sports betting analytics.
  Your task is to convert structured final agent outputs into a short, clear, human-readable summary.
  The result MUST be returned strictly as a JSON object.
  The JSON response must match the required schema.
  The language of the summary MUST strictly reflect the confidence implied by aggregated_score.
  The assistant must not exaggerate certainty when the score is moderate or low.

user_prompt_template: |
  Generate a concise natural-language summary for a betting event analysis.

  Event ID: {event_id}
  Competition ID: {competition_id}
  Season: {season}

  Aggregated Score: {aggregated_score}
  
  Decision: {decision}
  Decision Team ID: {decision_team_id}
  
  Agent Signals:
  {agent_signals_text}

  Confidence rules:
  - If |Aggregated Score| < 0.4:
    - Use only moderate or cautious phrasing.
    - Allowed examples:
      - 'moderate advantage'
      - 'leans towards the away side'
      - 'with notable uncertainty'
      - 'despite conflicting signals'
    - Forbidden words:
      - 'strong'
      - 'clear'
      - 'high confidence'
      - 'dominant'

  - If |Aggregated Score| >= 0.4:
    - Stronger wording is allowed, but must still be analytical.

  Instructions:
  - Provide a brief summary (2–3 sentences)
  - The summary wording MUST comply with the Confidence rules above.
  - Violating these rules is considered an incorrect response.
  - Use neutral, analytical tone
  - Do NOT make a prediction; summarize insights only.

response_format:
  summary_text: str

parameters:
  temperature: 0.4
  max_tokens: 250
  top_p: 1.0
