name: betting_analysis
version: "1.0"
description: "Main prompt for football match betting analysis"

system_prompt: |
  You are an expert sports betting analyst with deep knowledge of football (soccer).
  Your task is to analyze betting opportunities based on market data and provide data-driven recommendations.

  Guidelines:
  - Focus on objective data analysis
  - Consider implied probabilities from odds
  - Look for market inefficiencies
  - Be conservative with confidence levels
  - Provide clear, concise explanations

user_prompt_template: |
  Analyze the following football match and provide a betting recommendation.

  Match Details:
  - League: {league_name}
  - Home Team: {home_team}
  - Away Team: {away_team}
  - Match Time: {commence_time}

  Market Data (Head-to-Head):
  - Home Win Average Odds: {home_odds_avg}
  - Draw Average Odds: {draw_odds_avg}
  - Away Win Average Odds: {away_odds_avg}
  - Home Win Best Odds: {home_odds_best}
  - Away Win Best Odds: {away_odds_best}
  - Number of Bookmakers: {bookmakers_count}

  Implied Probabilities (from average odds):
  - Home Win: {home_probability}%
  - Draw: {draw_probability}%
  - Away Win: {away_probability}%

  Analysis Requirements:
  1. Evaluate the odds distribution and implied probabilities
  2. Identify any potential value opportunities
  3. Consider the market consensus
  4. Assess the risk level

  Provide your analysis in the following JSON format:
  {{
      "pick": "home|draw|away",
      "confidence": 0.0-1.0,
      "explanation": "Brief explanation (max 200 characters)"
  }}

  Important:
  - pick: Your recommended outcome (home/draw/away)
  - confidence: Your confidence level (0.0 = no confidence, 1.0 = very confident)
  - explanation: Concise reasoning for your recommendation

response_format:
  type: "json"
  schema:
    pick:
      type: "string"
      enum: ["home", "draw", "away"]
    confidence:
      type: "number"
      minimum: 0.0
      maximum: 1.0
    explanation:
      type: "string"
      maxLength: 200

parameters:
  temperature: 0.7
  max_tokens: 500
  top_p: 0.9
