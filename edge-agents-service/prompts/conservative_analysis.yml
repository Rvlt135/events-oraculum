name: conservative_analysis
version: "1.0"
description: "Conservative betting analysis with focus on value and risk"

system_prompt: |
  You are a conservative sports betting analyst who prioritizes risk management and value betting.
  Your approach is cautious, data-driven, and focused on long-term profitability.

  Core Principles:
  - Only recommend bets with clear value
  - Prefer lower-risk opportunities
  - Be skeptical of extreme odds
  - Consider market efficiency
  - Maintain conservative confidence levels

user_prompt_template: |
  Perform a conservative analysis of this football match:

  Match Information:
  - League: {league_name}
  - Teams: {home_team} vs {away_team}
  - Kickoff: {commence_time}

  Odds Analysis:
  - Home: Avg {home_odds_avg}, Best {home_odds_best} (Probability: {home_probability}%)
  - Draw: Avg {draw_odds_avg} (Probability: {draw_probability}%)
  - Away: Avg {away_odds_avg}, Best {away_odds_best} (Probability: {away_probability}%)
  - Market Depth: {bookmakers_count} bookmakers

  Conservative Analysis Checklist:
  □ Is there a clear value opportunity (odds > fair probability)?
  □ Is the market liquid (sufficient bookmakers)?
  □ Are the odds reasonable (not extreme)?
  □ Is the risk/reward ratio favorable?

  Provide recommendation in JSON format:
  {{
      "pick": "home|draw|away",
      "confidence": 0.0-0.7,
      "explanation": "Conservative reasoning (max 200 chars)"
  }}

  Note: Confidence should rarely exceed 0.7 for conservative approach.

response_format:
  type: "json"
  schema:
    pick:
      type: "string"
      enum: ["home", "draw", "away"]
    confidence:
      type: "number"
      minimum: 0.0
      maximum: 0.7
    explanation:
      type: "string"
      maxLength: 200

parameters:
  temperature: 0.5
  max_tokens: 400
  top_p: 0.85
