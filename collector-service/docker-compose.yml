version: '3.8'

services:
  odds-api:
    build:
      context: ../collector-service
      dockerfile: Dockerfile
    container_name: layerbit-odds_models-api
    command: python -m app.main
    ports:
      - "8083:8083"
    env_file:
      - ../collector-service/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - API_HOST=0.0.0.0
      - API_PORT=8083
      - ADMIN_ENABLED=true
    networks:
      - layerbit-net
    restart: unless-stopped

  odds-worker:
    build:
      context: ../collector-service
      dockerfile: Dockerfile
    container_name: layerbit-odds_models-worker
    command: python -m boot.worker
    env_file:
      - ../collector-service/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    networks:
      - layerbit-net
    restart: unless-stopped

  odds-scheduler:
    build:
      context: ../collector-service
      dockerfile: Dockerfile
    container_name: layerbit-odds_models-scheduler
    command: python -m boot.scheduler
    env_file:
      - ../collector-service/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    networks:
      - layerbit-net
    restart: unless-stopped

networks:
  layerbit-net:
    external: true
