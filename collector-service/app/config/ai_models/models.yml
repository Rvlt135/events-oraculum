providers:
  openrouter:
    models:
      mistralai/mistral-7b-instruct:
        context_window: 32768
        max_output_tokens: 2000
        temperature: 0.3
        supports_streaming: false
        supports_function_calling: true
      kwaipilot/kat-coder-pro:free:
        context_window: 40960
        max_output_tokens: 2000
        temperature: 0.3
        supports_streaming: false
        supports_function_calling: true


default_provider: openrouter
default_model: kwaipilot/kat-coder-pro:free

prioritizer:
  provider: openrouter
  model: kwaipilot/kat-coder-pro:free
  fallback_models:
    - mistralai/mistral-7b-instruct
  timeout_ms: 30000
  batch_size: 20
  rate_limit_qps: 2
  max_events: 500
  enabled: true
  cache_ttl_sec: 86400
  llm_mode: raw_json  # допустимые значения: "instructor", "raw_json"

retry_config:
  max_attempts: 3
  base_delay_sec: 1
  max_delay_sec: 30
  retriable_status_codes: [429, 500, 502, 503, 504]
  special_delays:
    "429": 30  # фиксированная пауза для 429

timeout_sec: 60
