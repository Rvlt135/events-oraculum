odds_api:
  sports:
    free:
      - Soccer
    pro:
      - Tennis
      - Basketball
      - Ice Hockey

  competitions:
    free:
      - soccer_uefa_champs_league
#      - soccer_uefa_europa_league
#      - soccer_uefa_champs_league_qualification
#      - soccer_epl
    pro:
      - soccer_epl
#      - soccer_fifa_world_cup_winner
#      - soccer_germany_bundesliga
#      - tennis_atp_wimbledon
#      - americanfootball_ufl
#      - basketball_nba
#      - icehockey_nhl

  api_football:
    soccer_uefa_champs_league:
      league_id: 2
      seasons:
        current: 2025
        previous: 2024
    soccer_epl:
      league_id: 39
      seasons:
        current: 2025
        previous: 2024

  events_window:
    period: 30  # окно вперёд, дней (E2)
    batch_size_competitions: 10
    rate_limit:
      delay_between_competitions_sec: 10  # пауза между опросами разных slug_key
      max_concurrency: 1                  # 1 = последовательная обработка (MVP)
    retry_policy:
      retriable_statuses: [429, 500, 502, 503, 504]
      max_attempts: 3
      base_delay_sec: 2
      max_delay_sec: 10
      jitter: true

  overload:
    max_events_per_competition_hint: 500  # порог для chunking
    batch_size_events: 20                 # размер порции записи в БД
    max_competitions_per_run: 15           # (опц.) ограничить число competitions за прогон

  participants:
    participant_mode_by_sport:
      soccer: duel
      tennis: duel
      basketball: duel
      ice_hockey: duel
      golf: solo

  events:
    teams_normalization:
      enabled: true  # E5: Resolve team_id for duel/solo modes via TeamRepository

  admin:
    events_view_limit: 200  # E10: Limit for GET /catalog/events/upcoming

  events_cache:
    upcoming_ttl_sec: 300  # TTL for catalog:events:{slug_key}:upcoming cache

  prioritizer:
    enabled: true
    mode: all  # per_competition | all
    max_events: 50
    ttl_sec: 86400
    llm_retry:
      max_attempts: 3
      base_delay_sec: 1
      max_delay_sec: 10
      special_delays:
        "429": 10  # фикс пауза для rate limit
      retriable_status_codes: [429, 500, 502, 503, 504]

  odds:
    regions: ["eu"]
    markets: ["h2h"]
    bookmakers: ["onexbet", "sport888", "williamhill", "betfair_ex_eu"]
    include_links: true
    include_sids: true
    include_bet_limits: false
    include_rotation_numbers: false
    max_events_per_request: 20
    use_event_ids: false