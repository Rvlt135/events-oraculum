default_provider: openrouter
default_model: z-ai/glm-4.5-air:free

prioritizer:
  provider: openrouter
  model: z-ai/glm-4.5-air:free
  fallback_models:
    - deepseek/deepseek-chat
    - openai/gpt-4o-mini
    - anthropic/claude-3.5-sonnet
  timeout_ms: 30000
  batch_size: 50
  rate_limit_qps: 2
  max_events: 500
  enabled: true
  cache_ttl_sec: 86400

retry_config:
  max_attempts: 3
  base_delay_sec: 1
  max_delay_sec: 30
  retriable_status_codes: [429, 500, 502, 503, 504]
  special_delays:
    "429": 30  # фиксированная пауза для 429

timeout_sec: 60
