providers:
  openrouter:
    models:
      z-ai/glm-4.5-air:free:
        context_window: 131072
        max_output_tokens: 2048
        temperature: 0.3
        supports_streaming: false
        supports_function_calling: true
      openai/gpt-oss-20b:free:
        context_window: 131072
        max_output_tokens: 2048
        temperature: 0.3
        supports_streaming: false
        supports_function_calling: true


default_provider: openrouter
default_model: z-ai/glm-4.5-air:free

prioritizer:
  provider: openrouter
  model: z-ai/glm-4.5-air:free
  fallback_models:
    - openai/gpt-oss-20b:free
  timeout_ms: 30000
  batch_size: 20
  rate_limit_qps: 5
  max_events: 500
  enabled: true
  cache_ttl_sec: 86400

retry_config:
  max_attempts: 3
  base_delay_sec: 1
  max_delay_sec: 10
  retriable_status_codes: [429, 500, 502, 503, 504]
  special_delays:
    "429": 10  # фиксированная пауза для 429

timeout_sec: 60
