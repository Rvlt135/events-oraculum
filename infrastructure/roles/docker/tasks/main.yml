- name: Remove conflicting Docker source list
  file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent
  become: yes
  become_user: root

- name: Install dependencies
  apt:
    name: "{{ item }}"
    state: present
    update_cache: true
  loop:
    - apt-transport-https
    - ca-certificates
    - curl
    - software-properties-common
    - gnupg
  become: yes
  become_user: root

- name: Ensure /etc/apt/keyrings directory exists
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: yes
  become_user: root

- name: Add Docker's official GPG key
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    keyring: /etc/apt/keyrings/docker.gpg
    state: present
  become: yes
  become_user: root

- name: Add Docker APT repository
  vars:
    arch_mapping:
      x86_64: amd64
      aarch64: arm64
  apt_repository:
    repo: "deb [arch={{ arch_mapping[ansible_architecture] | default('amd64') }} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_lsb.codename }} stable"
    filename: docker
    state: present
    update_cache: yes
  become: yes
  become_user: root

- name: Update APT package index
  apt:
    update_cache: yes
  become: yes
  become_user: root

- name: Install Docker and related packages
  apt:
    name: "{{ item }}"
    state: present
    update_cache: true
  loop:
    - docker-ce
    - docker-ce-cli
    - containerd.io
    - docker-buildx-plugin
    - docker-compose-plugin
  become: yes
  become_user: root

- name: Add Docker group
  group:
    name: docker
    state: present
  become: yes
  become_user: root

- name: Add user to Docker group
  user:
    name: "{{ user_name }}"
    groups: docker
    append: true
  become: yes
  become_user: root

- name: Enable and start Docker services
  systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - docker.service
    - containerd.service
  become: yes
  become_user: root

- name: Ensure Docker socket has correct permissions
  file:
    path: /var/run/docker.sock
    owner: root
    group: docker
    mode: '0660'
  become: yes
  become_user: root

- name: Check install docker compose
  shell: docker compose version
