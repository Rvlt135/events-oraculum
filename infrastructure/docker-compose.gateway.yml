version: '3.8'

services:
  gateway:
    build:
      context: ../gateway-service
      dockerfile: Dockerfile
    container_name: layerbit-gateway
    command: python -m app.main
    ports:
      - "8080:8080"
    env_file:
      - ../gateway-service/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    networks:
      - layerbit-net
    restart: unless-stopped

networks:
  layerbit-net:
    external: true
